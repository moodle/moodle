issueNumber: MDL-75699
notes:
  core:
    - message: >-
        The title of a modal dialogue rendered by the `core/modal` template is
        now an `<h2>` element instead of an `<h5>`, so that dialogue titles no
        longer break the page's heading hierarchy for assistive technology
        users.


        The element carries the Bootstrap `fs-5` font size utility class, so the
        title's appearance is unchanged.


        If your plugin renders headings inside modal dialogue content, set their
        levels relative to this `<h2>` (i.e. start at `<h3>`) so that the
        heading structure remains correctly nested. Headings that were
        previously nested beneath the old `<h5>` will now skip levels. If your
        plugin renders its own modal header markup, or overrides the `header`
        block of the `core/modal` template, apply the same `<h2
        class="modal-title fs-5">` pattern.
      type: changed
