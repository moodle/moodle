issueNumber: MDL-90110
notes:
  core:
    - message: >-
        Added `theme_build_editor_css_for_themes()` to `lib/outputlib.php` to
        build and cache the editor content CSS for themes without changing the
        theme revisions. The editor content CSS is now cached in the
        `core/postprocessedcss` cache, using the new
        `theme_config::get_editor_css_cache_key()`,
        `theme_config::get_editor_css_cached_content()` and
        `theme_config::set_editor_css_content_cache()` methods.
      type: improved
