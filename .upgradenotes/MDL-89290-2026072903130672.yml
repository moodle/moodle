issueNumber: MDL-89290
notes:
  core_admin:
    - message: >-
        The admin notifications page (`/admin/index.php`) now groups and orders notifications by
        severity (danger, then warning, then notice) and shows a severity count summary line above
        the list. The legacy campaign banner, services-and-support banner, Marketplace one-line
        notice and feedback-encouragement notice have been replaced by a single "From Moodle" call
        to action card grid, rendered by the new `core_admin\output\notification_ctas` renderable
        and the `core_admin/notification_ctas` template. Individual cards can be hidden with the
        new config.php-only `$CFG->disablenotificationctas` array setting.
      type: changed
    - message: >-
        `core_admin_renderer::warning_with_label()` has been added. It prefixes a notification with
        a bold severity category label (for example "Security" or "Warning") and then delegates to
        `core_admin_renderer::warning()`, whose signature is unchanged.
      type: improved
    - message: >-
        `core_admin_renderer::admin_notifications_page()` has been deprecated in favour of
        `core_admin_renderer::notifications_page()`, which carries the same argument list without
        the `$showcampaigncontent`, `$showfeedbackencouragement` and `$showservicesandsupport`
        arguments. The deprecated method still renders the page and ignores those three arguments.
      type: deprecated
    - message: >-
        The following `core_admin_renderer` methods have been deprecated, as the content they
        rendered has been replaced by the "From Moodle" call to action cards:


        - `campaign_content()`

        - `services_and_support_content()`

        - `userfeedback_encouragement()`

        - `marketplace_integration_notice()`
      type: deprecated
    - message: >-
        The `$CFG->showcampaigncontent` setting is no longer used, because the campaign banner it
        controlled has been removed from the admin notifications page. `$CFG->showservicesandsupportcontent`
        is still used, but now only controls the "Services and support" link in the help popover
        (`core_renderer::services_support_link()`); it no longer affects the notifications page.
      type: removed
  core:
    - message: >-
        The `core/external_content_banner` template has been deprecated. It was only used by the
        admin notifications page banners, which have been replaced by the
        `core_admin/notification_ctas` template. Final deprecation is planned for Moodle 6.0.
      type: deprecated
