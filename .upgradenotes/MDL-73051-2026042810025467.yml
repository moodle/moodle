issueNumber: MDL-73051
notes:
  core_question:
    - message: >
        The `\core\question\local\bank\bulk_action_base` class now defines the
        `get_action_icon` method. Bulk action classes must override this
        to return an icon identifier. The icon is displayed on the action's
        button in the sticky footer. See `\qbank_bulkmove\bulk_move_action`
        for an example.
      type: improved
