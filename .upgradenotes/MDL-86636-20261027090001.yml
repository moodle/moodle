issueNumber: MDL-86636
notes:
  core:
    - message: >-
        The behat steps `following "..." should download a file that:` and
        `following "..." in the "..." "..." should download a file that:` now
        accept an optional selector type, so a download can be triggered from
        any element, not just a link. For example: `following "Export as Moodle
        XML" "button" in the "#bulkactionsui-container" "css_element" should
        download a file that:`. Anything that submits a form is supported, and
        the form data is sent with the request as the browser would send it.
      type: improved
