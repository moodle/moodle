name: Windows Rector

on:
  workflow_dispatch:
    inputs:
      extra_options:
        description: Additional options to apply to Rector
        required: false
        default: ''
env:
  php: 8.4

jobs:
  Rector:
    runs-on: windows-latest

    steps:
      - name: Configuring git vars
        uses: rlespinasse/github-slug-action@v5

      - name: Setting up PHP ${{ env.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.php }}
          extensions: exif, fileinfo, gd, intl, pgsql, mysql, redis, soap, sodium, zip
          ini-values: max_input_vars=5000
          coverage: none

      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checking out code from ${{ env.GITHUB_REF_SLUG }}
        uses: actions/checkout@v7

      - uses: ramsey/composer-install@v4

      - name: Rector Cache
        uses: actions/cache@v6
        with:
          path: ".rector/cache"
          key: ${{ runner.os }}-rector-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-rector-

      # Full Rector run.
      # The `--dry-run` arg will make Rector fail if any changes are needed, without actually applying them.
      - name: Run Rector
        run: php ./vendor-bin/rector/vendor/rector/rector/bin/rector --ansi --dry-run ${{ inputs.extra_options }}
